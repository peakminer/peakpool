# parano1d solo mining pool — full node + peakpool, ready to run.
#
#   cp .env.example .env      # edit WALLET_ADDRESS to your own wallet
#   docker compose up -d
#   docker compose logs -f pool
#
# Point your rigs (peakminer) at <this host>:34254 — nothing else to configure on
# the miner side, see step 5 of the README.
#
# Everything tunable lives in .env; you should not need to touch this file.
# Wallet/telemetry helpers live in ./p1d (./p1d help).

name: parano1d-pool

services:
  node:
    image: peakminer/parano1d-node:1.0.4
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      # P2P — must reach the internet for the node to follow the chain.
      - "9600:9600"
      # The pool shares this netns (network_mode: service:node), so ITS ports are
      # published here, on the node:
      - "34254:34254"           # SV2 — the only miner-facing port
      - "127.0.0.1:9330:9330"   # pool telemetry (/stats, /metrics, /healthz)
    networks:
      default: {}
      # The pool's telemetry lives in this netns, so it is reachable at the
      # node's address; this alias is how VictoriaMetrics scrapes it (see
      # deployments/monitoring/vm-scrape.yml).
      peakpool:
        aliases: [parano1d-pool]
    volumes:
      # MDBX chain state AND the node's wallet.key. Back it up (see below).
      - chain:/chain
    environment:
      MINING_KEY: ${MINING_KEY:?set MINING_KEY in .env}
    # HistoryStep proving is an all-core phase on the critical path; give the
    # node the machine. 0 = unlimited.
    cpus: ${NODE_CPUS:-0}
    healthcheck:
      # Runs on the node's own loopback → parano1d grants full Local access with
      # no credential, so it reads real readiness (synced + peer quorum).
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 10 -H 'Content-Type: application/json'
          --data '{"jsonrpc":"2.0","id":1,"method":"paranoid_getNodeStatus","params":[]}'
          http://127.0.0.1:9601 | grep -q '"mining_ready":true'
      interval: 15s
      timeout: 15s
      retries: 40
      start_period: 120s

  pool:
    image: peakminer/peakpool:0.1.4
    restart: unless-stopped
    # Share the node's netns: the pool reaches the RPC on 127.0.0.1 as a loopback
    # client, which parano1d grants FULL access with no credential (read balance,
    # chain info, serve templates). Its ports are published on the node above.
    network_mode: "service:node"
    depends_on:
      node:
        condition: service_healthy
    environment:
      # Your own o1… payout wallet — REQUIRED. The coinbase pays it directly
      # (non-custodial). No MINING_KEY: the pool uses loopback Local access.
      WALLET_ADDRESS: ${WALLET_ADDRESS:?set WALLET_ADDRESS in .env to your o1… wallet}
      MIN_SHARE_DIFFICULTY: ${MIN_SHARE_DIFFICULTY:-1000000}
      # Keep the colored table/share lines in `docker logs` (stderr is not a
      # TTY there, so color is off by default). Set NO_COLOR=1 to disable.
      FORCE_COLOR: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:9330/healthz | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # One-shot wallet backup:  ./p1d backup   (= docker compose run --rm backup)
  # Copies the FULL wallet set (not just wallet.key) — the marker file is needed
  # to restore. Then copy ./backup OFF THIS MACHINE. Chain data resyncs in ~20s;
  # the wallet does not come back if lost.
  backup:
    profiles: ["backup"]
    image: debian:bookworm-slim
    volumes:
      - chain:/chain:ro
      - ./backup:/backup
    command:
      - /bin/sh
      - -c
      - >-
        set -eu;
        install -m 700 -d /backup;
        cp -a /chain/wallet.key /chain/wallet.meta /chain/.network-storage-epoch /backup/;
        cp -a /chain/wallet.history /chain/wallet.receipts /backup/ 2>/dev/null || true;
        chmod 600 /backup/wallet.key;
        ls -la /backup;
        echo "Full wallet backup in ./backup — copy it OFF this machine. Restore: README section 6."

  # One-shot wallet RESTORE:  ./p1d restore   (stops the node, then this, then starts it)
  # Copies the full wallet set from ./backup back into the chain volume. The
  # .network-storage-epoch marker MUST be present or the node wipes the dir.
  restore:
    profiles: ["backup"]
    image: debian:bookworm-slim
    volumes:
      - chain:/chain
      - ./backup:/backup:ro
    command:
      - /bin/sh
      - -c
      - >-
        set -eu;
        test -f /backup/wallet.key || { echo "no ./backup/wallet.key — put your backup files in ./backup first"; exit 1; };
        cp -a /backup/wallet.key /backup/wallet.meta /backup/.network-storage-epoch /chain/;
        cp -a /backup/wallet.history /backup/wallet.receipts /chain/ 2>/dev/null || true;
        chown 0:0 /chain/wallet.key /chain/wallet.meta /chain/.network-storage-epoch;
        chown 0:0 /chain/wallet.history /chain/wallet.receipts 2>/dev/null || true;
        chmod 600 /chain/wallet.key;
        echo "wallet restored into the chain volume — start the node, then: ./p1d address"

volumes:
  chain:

networks:
  peakpool:
    name: peakpool
